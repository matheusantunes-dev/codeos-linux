# tira as bibliotecas que só o instalador usava (Qt/KDE do Calamares) e o que só valia na sessão live
---
dontChroot: false
timeout: 600
script:
    - command: "apt-get -y autoremove --purge"
    - command: "rm -f /usr/share/applications/codeos-instalar.desktop /etc/xdg/autostart/codeos-instalar.desktop /etc/xdg/autostart/codeos-live.desktop"
    - command: "install -d -m 755 /var/log/installer"
