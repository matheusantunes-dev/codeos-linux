# Depois de copiar o sistema: sai o que só serve à sessão "live" e ao instalador; entram os pacotes de
# idioma de quem instalou.
---
update_db: true
backend: apt
operations:
  - remove:
      - "^live-*"
      - casper
      - calamares
      - calamares-settings-ubuntu-common
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
