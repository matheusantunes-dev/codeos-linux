# conta de quem instala: administrador (sudo) e os grupos de um sistema de mesa; video = brilho da tela
# sem administrador (brightnessctl)
---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - users
    - video
    - name: sambashare
      must_exist: false
      system: true
    - sudo
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
allowActiveDirectory: false
