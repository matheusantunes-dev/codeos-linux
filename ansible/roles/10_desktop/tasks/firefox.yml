# Firefox oficial da Mozilla (repositório apt dela), como recomenda a própria Mozilla para Debian/Ubuntu:
# o do Ubuntu é um pacote de transição para o snap, e o do Mint é recompilado por ele.
- name: Chave do repositório da Mozilla
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"
  become: true

- name: Repositório da Mozilla
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mozilla.list
    content: |
      deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main
    mode: "0644"
  become: true

# o Firefox da Mozilla sempre na frente do pacote de transição (snap) do Ubuntu
- name: Firefox da Mozilla na frente do do Ubuntu
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    mode: "0644"
  become: true

- name: Firefox
  ansible.builtin.apt:
    name: firefox
    state: latest
    update_cache: true
  become: true

# os pacotes de idioma do Firefox do Mint são de outra versão e o Firefox da Mozilla não os usa
- name: Tirar os pacotes de idioma do Firefox do Mint
  ansible.builtin.shell: |
    velhos=$(dpkg-query -W -f='${Package} ${Version}\n' 'firefox-locale-*' 2>/dev/null | awk '/linuxmint/ {print $1}')
    [ -z "$velhos" ] || { apt-get -y purge $velhos >/dev/null && echo mudou; }
  become: true
  register: desktop_firefox_locale
  changed_when: "'mudou' in desktop_firefox_locale.stdout"

- name: Firefox em português do Brasil (o idioma segue o do sistema)
  ansible.builtin.apt:
    name: firefox-l10n-pt-br
    state: present
  become: true

# Placa de vídeo do Firefox (notebook com Intel + NVIDIA no on-demand). Abre na Intel: na NVIDIA cada
# quadro volta para a Intel por uma cópia entre as placas, e no Nitro isso travava a interface e o
# mouse por 1–2 s. Para jogos pesados no navegador (a Intel usa a RAM do sistema como memória de vídeo:
# o GeoFS no máximo esgotou os 32 GB), "Open with NVIDIA" no menu. O /usr/local/bin/firefox vem antes
# de /usr/bin no PATH, então vale para menu, barra, links e terminal.
- name: Escolha da placa de vídeo ao abrir programas (codeos-gpu) e Firefox por ela
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: codeos-gpu, dest: /usr/local/bin/codeos-gpu }
    - { src: firefox-codeos-gpu, dest: /usr/local/bin/firefox }
  become: true

# "Open with NVIDIA" / "Open with Intel" no botão direito do Firefox no menu (como o "Launch using
# Discrete Graphics Card" do GNOME). Feito a cada apply a partir do atalho do pacote, para seguir as
# atualizações do Firefox. A escolha vale ao abrir o Firefox: com ele já aberto, a janela nova entra
# no processo que já existe, na placa dele.
- name: Firefox com opções de placa de vídeo no menu
  ansible.builtin.shell: |
    orig=/usr/share/applications/firefox.desktop
    dest=/usr/share/codeos/applications/firefox.desktop
    { sed -e '0,/^Actions=/s/^Actions=\(.*\)$/Actions=\1codeos-nvidia;codeos-intel;/' "$orig"
      printf '\n[Desktop Action codeos-nvidia]\nName=Open with NVIDIA\nExec=codeos-gpu --nvidia /usr/bin/firefox --new-window %%u\n'
      printf '\n[Desktop Action codeos-intel]\nName=Open with Intel\nExec=codeos-gpu --intel /usr/bin/firefox --new-window %%u\n'
    } > "$dest.novo"
    if cmp -s "$dest.novo" "$dest"; then rm -f "$dest.novo"; else chmod 644 "$dest.novo"; mv "$dest.novo" "$dest"; echo mudou; fi
  args:
    removes: /usr/share/applications/firefox.desktop
  become: true
  register: desktop_firefox_gpu
  changed_when: "'mudou' in desktop_firefox_gpu.stdout"
