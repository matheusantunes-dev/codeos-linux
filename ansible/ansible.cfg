[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = /usr/bin/python3
callback_result_format = yaml
# tempo de cada tarefa no fim do apply (para achar o que deixa o apply lento)
callbacks_enabled = ansible.posix.profile_tasks
retry_files_enabled = False
# handlers (cache de fontes) rodam mesmo se uma tarefa falhar depois de mudar algo
force_handlers = True

[connection]
# Sem pipelining o Ansible passa a senha do sudo por um pseudo-terminal, e o "Defaults pwfeedback"
# do Linux Mint faz o sudo travar ali. Com pipelining a senha vai pelo stdin, sem pty.
pipelining = True

[privilege_escalation]
# pede a senha do sudo uma vez no início
become_ask_pass = True
